<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                        "secondary-container": "#fe8a7d",

                        "tertiary-fixed-dim": "#5fd9d0",
                        "surface": "#f8f9fb",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary": "#ffffff",

                    "borderRadius": {
                        "DEFAULT": "1rem",

                    "fontFamily": {
                        "headline": ["Plus Jakarta Sans", "PingFang SC Medium"],
                        "body": ["Manrope", "PingFang SC Regular"],
                        "label": ["Manrope", "PingFang SC Medium"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Manrope', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .zen-glass {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 h-16 bg-white/80 dark:bg-neutral-900/80 backdrop-blur-2xl shadow-[0_32px_32px_-4px_rgba(0,0,0,0.06)]">
<div class="flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-neutral-100/50 transition-all active:scale-95 duration-200">
<span class="material-symbols-outlined text-[#b51a1a]">arrow_back</span>
</button>
<h1 class="text-xl font-bold text-[#b51a1a] tracking-tight font-['Plus_Jakarta_Sans']">Zen Kinetic</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-neutral-100/50 transition-all active:scale-95 duration-200">
<span class="material-symbols-outlined text-neutral-500">settings</span>
</button>
</header>
<main class="pt-24 px-6 max-w-2xl mx-auto">
<!-- Header Section -->
<div class="mb-10">
<h2 class="text-4xl font-headline font-extrabold tracking-tight text-on-surface mb-2">创建计划</h2>
<p class="text-on-surface-variant font-body leading-relaxed">定制属于您的身心律动旅程</p>
</div>
<!-- Form Canvas -->
<div class="space-y-8">
<!-- Plan Name Input -->
<section class="space-y-4">
<label class="block text-sm font-label font-bold tracking-widest text-primary uppercase px-1">计划名称</label>
<div class="relative group">
<input class="w-full h-16 px-6 bg-surface-container-lowest rounded-xl border-none focus:ring-2 focus:ring-primary/20 text-lg font-medium transition-all placeholder:text-surface-dim" placeholder="输入您的计划名称..." type="text" value="晨间力量训练"/>
</div>
</section>
<!-- Goal Selection -->
<section class="space-y-4">
<label class="block text-sm font-label font-bold tracking-widest text-primary uppercase px-1">训练目标</label>
<div class="grid grid-cols-2 gap-3">
<button class="flex flex-col items-center justify-center p-6 bg-gradient-to-br from-primary to-primary-container text-on-primary rounded-xl shadow-lg shadow-primary/10 active:scale-95 transition-all">
<span class="material-symbols-outlined mb-2" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
<span class="font-bold tracking-tight">减脂</span>
</button>
<button class="flex flex-col items-center justify-center p-6 bg-surface-container-lowest text-on-surface-variant rounded-xl hover:bg-surface-container-high transition-all active:scale-95">
<span class="material-symbols-outlined mb-2">fitness_center</span>
<span class="font-bold tracking-tight">增肌</span>
</button>
<button class="flex flex-col items-center justify-center p-6 bg-surface-container-lowest text-on-surface-variant rounded-xl hover:bg-surface-container-high transition-all active:scale-95">
<span class="material-symbols-outlined mb-2">self_improvement</span>
<span class="font-bold tracking-tight">塑形</span>
</button>
<button class="flex flex-col items-center justify-center p-6 bg-surface-container-lowest text-on-surface-variant rounded-xl hover:bg-surface-container-high transition-all active:scale-95">
<span class="material-symbols-outlined mb-2">bolt</span>
<span class="font-bold tracking-tight">耐力</span>
</button>
</div>
</section>
<!-- Exercises Section -->
<section class="space-y-4">
<div class="flex items-center justify-between px-1">
<label class="block text-sm font-label font-bold tracking-widest text-primary uppercase">动作列表</label>
<button class="flex items-center gap-1 text-tertiary font-bold text-sm">
<span class="material-symbols-outlined text-lg">add_circle</span>
                        添加动作
                    </button>
</div>
<!-- Exercise Cards - Bento Style -->
<div class="space-y-4">
<!-- Exercise Item 1 -->
<div class="group relative overflow-hidden bg-surface-container-lowest rounded-xl p-6 flex items-center gap-6 transition-all hover:bg-white">
<div class="w-16 h-16 rounded-lg overflow-hidden bg-surface-container shrink-0">
<img class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-500" data-alt="Close-up of person performing heavy barbell squats in a minimalist gym setting with soft natural light" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA0LJaACFmR4ONoeEK9-3l48bw3h5QqtbPuUEG8Oe9XkKo8Maz7bxMy6YRqdmtijsgc--X7IeQ_kGXvu9p2ag3qrCp1wSb7bKQXF7UJqX1bXebNf7kLcWOqdaVywynY4BDBrsjCW5pnPV4TjsSfTZb2D4FhLCO5iV510SHGaaaYZTa68Xy0BhvfQU9mnlhQBmwUq-JxLFoVZ4FUyXaZT-3o6vKZ8srEypuY0bLVsShCuyEywQrvnQYmqfbY9mhpYJlNqLlfFiBGCVTc"/>
</div>
<div class="flex-grow">
<h4 class="text-lg font-bold text-on-surface leading-tight">深蹲 Squats</h4>
<div class="flex items-center gap-3 mt-1 text-on-surface-variant text-sm font-medium">
<span class="flex items-center gap-1"><span class="material-symbols-outlined text-xs">format_list_numbered</span> 4 组</span>
<span class="flex items-center gap-1"><span class="material-symbols-outlined text-xs">refresh</span> 12 次</span>
</div>
</div>
<button class="w-10 h-10 flex items-center justify-center text-surface-dim hover:text-error transition-colors">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
<!-- Exercise Item 2 -->
<div class="group relative overflow-hidden bg-surface-container-lowest rounded-xl p-6 flex items-center gap-6 transition-all hover:bg-white">
<div class="w-16 h-16 rounded-lg overflow-hidden bg-surface-container shrink-0">
<img class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-500" data-alt="Person performing pushups on a wooden floor in a bright sunlit studio with minimalist aesthetic" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAlP_ATJrYqFMvLVIUOoTWP5Gn-Zb-9kOipRWxyebYCDmxGpX1XskvxSk-26iQmma29SFEKvP482AAZjAEwsnwBNubygmdRsXIIOG688U8oWt4seEntydVEUUHCBF9d6TQ3NEaG8wHG6rSyTEA5CSqVw0uMTQ7nPQN294BlluzE5IsA_j4o27QBrv1E3iFN3C6H5Ou0ccw90cNiIgLTMCINxTQ9jWBoePH_xLzZIWeQONuPGjPPIlmZoL-k8qm0zunLDecz5fYjUNEA"/>
</div>
<div class="flex-grow">
<h4 class="text-lg font-bold text-on-surface leading-tight">俯卧撑 Push-ups</h4>
<div class="flex items-center gap-3 mt-1 text-on-surface-variant text-sm font-medium">
<span class="flex items-center gap-1"><span class="material-symbols-outlined text-xs">format_list_numbered</span> 3 组</span>
<span class="flex items-center gap-1"><span class="material-symbols-outlined text-xs">refresh</span> 15 次</span>
</div>
</div>
<button class="w-10 h-10 flex items-center justify-center text-surface-dim hover:text-error transition-colors">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
<!-- Exercise Item 3 -->
<div class="group relative overflow-hidden bg-surface-container-lowest rounded-xl p-6 flex items-center gap-6 transition-all hover:bg-white">
<div class="w-16 h-16 rounded-lg overflow-hidden bg-surface-container shrink-0">
<img class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-500" data-alt="Close-up of dumbbells on a rack in a premium fitness studio with warm mood lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB49nzKRw88lP2vlYQH8SBKvg8Hflx0hSng_C-LSHvdOnt_GItgO73m_UNcGwNFqI7jmIvT_nr-r0uEt2OqrhOn-MohGh6wbSSbU54_sqiEDNnYEdLM5gv0cEYoiizbf4OWq6ZOjEbuFKhYjiKiK9SxxEauNIiWO2vlJbuYBxvUhFQ-RLwVZg9ysYL0M9-oroQtUDdgYpFSiPwYEJ_sVMyCGfpPGeb7zEHsQrI2EgBY6WiS_rt-ay_w8xzAGonJKXwQESjxlakI2nmq"/>
</div>
<div class="flex-grow">
<h4 class="text-lg font-bold text-on-surface leading-tight">哑铃弯举 Bicep Curls</h4>
<div class="flex items-center gap-3 mt-1 text-on-surface-variant text-sm font-medium">
<span class="flex items-center gap-1"><span class="material-symbols-outlined text-xs">format_list_numbered</span> 3 组</span>
<span class="flex items-center gap-1"><span class="material-symbols-outlined text-xs">refresh</span> 10 次</span>
</div>
</div>
<button class="w-10 h-10 flex items-center justify-center text-surface-dim hover:text-error transition-colors">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
</div>
</section>
</div>
</main>
<!-- Bottom Actions & Navigation Wrapper -->
<div class="fixed bottom-0 left-0 w-full z-50">
<!-- Floating CTA Button -->
<div class="flex justify-center px-6 pb-6">
<button class="w-full max-w-md h-16 bg-gradient-to-br from-[#b51a1a] to-[#d93630] text-white font-bold text-lg rounded-xl shadow-[0_10px_40px_rgba(181,26,26,0.3)] active:scale-95 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined">check_circle</span>
                保存计划
            </button>
</div>
<!-- BottomNavBar (Suppressed as per task logic: Task-Focused screens hide main nav, but provided for shell integrity if needed) -->
<nav class="hidden fixed bottom-0 left-0 w-full z-40 bg-white/80 dark:bg-neutral-900/80 backdrop-blur-2xl flex justify-around items-center px-4 pb-6 pt-2 shadow-[0_-10px_40px_rgba(0,0,0,0.04)] rounded-t-[3rem]">
<a class="flex flex-col items-center justify-center text-neutral-400 p-2 hover:text-[#b51a1a] transition-colors" href="#">
<span class="material-symbols-outlined">speed</span>
<span class="text-[10px] font-medium uppercase tracking-widest mt-1">Pulse</span>
</a>
<a class="flex flex-col items-center justify-center bg-gradient-to-br from-[#b51a1a] to-[#d93630] text-white rounded-full w-14 h-14 -mt-4 shadow-lg shadow-red-500/20 active:scale-90 transition-transform duration-300" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">event_note</span>
<span class="text-[10px] font-medium uppercase tracking-widest mt-1">Plans</span>
</a>
<a class="flex flex-col items-center justify-center text-neutral-400 p-2 hover:text-[#b51a1a] transition-colors" href="#">
<span class="material-symbols-outlined">history</span>
<span class="text-[10px] font-medium uppercase tracking-widest mt-1">Logs</span>
</a>
<a class="flex flex-col items-center justify-center text-neutral-400 p-2 hover:text-[#b51a1a] transition-colors" href="#">
<span class="material-symbols-outlined">person</span>
<span class="text-[10px] font-medium uppercase tracking-widest mt-1">Profile</span>
</a>
</nav>
</div>
</body></html>
