<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Zen Kinetic - 杠铃深蹲</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Manrope:wght@400;500;600&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#d9dadc",
                        "secondary": "#9e4038",
                        "on-tertiary": "#ffffff",
                        "on-surface": "#191c1e",
                        "inverse-surface": "#2e3132",
                        "error-container": "#ffdad6",
                        "outline": "#8f706c",
                        "secondary-container": "#fe8a7d",
                        "primary": "#b51a1a",
                        "on-primary-fixed-variant": "#93000a",
                        "surface-variant": "#e1e2e4",
                        "error": "#ba1a1a",
                        "on-error": "#ffffff",
                        "on-surface-variant": "#5b403d",
                        "surface-tint": "#b91d1c",
                        "secondary-fixed-dim": "#ffb4ab",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed-dim": "#5fd9d0",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed": "#00201e",
                        "on-secondary-container": "#75221c",
                        "on-error-container": "#93000a",
                        "inverse-on-surface": "#f0f1f3",
                        "surface-container-high": "#e7e8ea",
                        "primary-fixed": "#ffdad6",
                        "on-secondary-fixed-variant": "#7f2923",
                        "on-primary-fixed": "#410002",
                        "tertiary": "#006762",
                        "surface-container": "#edeef0",
                        "outline-variant": "#e4beb9",
                        "inverse-primary": "#ffb4ab",
                        "surface": "#f8f9fb",
                        "primary-container": "#d93630",
                        "tertiary-fixed": "#7ef6ec",
                        "on-tertiary-fixed-variant": "#00504c",
                        "on-secondary-fixed": "#410002",
                        "on-background": "#191c1e",
                        "surface-container-highest": "#e1e2e4",
                        "surface-bright": "#f8f9fb",
                        "on-primary-container": "#fffbff",
                        "on-primary": "#ffffff",
                        "secondary-fixed": "#ffdad6",
                        "background": "#f8f9fb",
                        "surface-container-low": "#f2f4f6",
                        "on-tertiary-container": "#f3fffd",
                        "tertiary-container": "#00837c",
                        "primary-fixed-dim": "#ffb4ab"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Plus Jakarta Sans"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface font-body text-on-surface">
<!-- Top AppBar (Simplified for Focused Task) -->
<header class="bg-white/80 dark:bg-zinc-900/80 backdrop-blur-xl fixed top-0 w-full z-50 flex justify-between items-center px-6 py-4 shadow-sm shadow-red-900/5">
<div class="flex items-center gap-4">
<button class="p-2 hover:bg-zinc-100 rounded-full transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-zinc-600">close</span>
</button>
<h1 class="font-headline font-bold tracking-tight text-xl text-zinc-900">杠铃深蹲</h1>
</div>
<div class="flex items-center gap-2">
<span class="text-xs font-bold px-3 py-1 bg-red-50 text-red-700 rounded-full">进行中</span>
</div>
</header>
<main class="pt-24 pb-32 px-6 max-w-2xl mx-auto space-y-8">
<!-- Timer Hero Section -->
<section class="relative text-center py-8">
<div class="absolute inset-0 bg-gradient-to-b from-red-50/50 to-transparent -z-10 rounded-xl"></div>
<p class="font-headline text-zinc-400 text-sm tracking-[0.2em] uppercase font-bold mb-2">训练用时</p>
<div class="font-headline text-8xl font-extrabold tracking-tighter text-zinc-900 drop-shadow-sm">
                04:12
            </div>
<div class="flex justify-center gap-4 mt-4">
<div class="flex items-center gap-2 text-zinc-500">
<span class="material-symbols-outlined text-sm">pulse_alert</span>
<span class="text-sm font-semibold">142 BPM</span>
</div>
<div class="w-[1px] h-4 bg-zinc-200 self-center"></div>
<div class="flex items-center gap-2 text-zinc-500">
<span class="material-symbols-outlined text-sm">local_fire_department</span>
<span class="text-sm font-semibold">124 KCAL</span>
</div>
</div>
</section>
<!-- Bento Grid for Progress & Inputs -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<!-- Set Counter Card -->
<div class="bg-surface-container-lowest p-8 rounded-xl flex flex-col items-center justify-center space-y-2 border-b-4 border-red-100">
<p class="text-zinc-400 text-xs font-bold uppercase tracking-widest">当前组数</p>
<div class="flex items-baseline gap-1">
<span class="text-5xl font-headline font-black text-primary">3</span>
<span class="text-zinc-300 text-2xl font-headline font-bold">/ 5</span>
</div>
<div class="w-full flex gap-1 mt-4">
<div class="h-1.5 flex-1 bg-primary rounded-full"></div>
<div class="h-1.5 flex-1 bg-primary rounded-full"></div>
<div class="h-1.5 flex-1 bg-primary rounded-full"></div>
<div class="h-1.5 flex-1 bg-surface-container-highest rounded-full"></div>
<div class="h-1.5 flex-1 bg-surface-container-highest rounded-full"></div>
</div>
</div>
<!-- Volume Summary Card -->
<div class="bg-surface-container-lowest p-8 rounded-xl flex flex-col justify-center border-b-4 border-zinc-100">
<div class="space-y-4">
<div class="flex justify-between items-center">
<span class="text-zinc-500 text-sm font-medium">累计容量</span>
<span class="text-zinc-900 font-headline font-bold">2,400 kg</span>
</div>
<div class="flex justify-between items-center">
<span class="text-zinc-500 text-sm font-medium">最佳纪录</span>
<span class="text-tertiary font-headline font-bold">110 kg</span>
</div>
<div class="flex justify-between items-center">
<span class="text-zinc-500 text-sm font-medium">休息间隔</span>
<span class="text-zinc-900 font-headline font-bold">01:30</span>
</div>
</div>
</div>
</div>
<!-- Logging Area -->
<section class="space-y-6">
<div class="flex items-end gap-4">
<div class="flex-1 space-y-3">
<label class="block text-sm font-bold text-zinc-600 px-2">重量 (kg)</label>
<div class="relative">
<input class="w-full bg-surface-container-highest border-none rounded-lg p-6 text-3xl font-headline font-black focus:ring-2 focus:ring-primary/20 transition-all text-zinc-900" type="number" value="80"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2 flex flex-col gap-1">
<button class="text-zinc-400 hover:text-primary active:scale-90 transition-all">
<span class="material-symbols-outlined">expand_less</span>
</button>
<button class="text-zinc-400 hover:text-primary active:scale-90 transition-all">
<span class="material-symbols-outlined">expand_more</span>
</button>
</div>
</div>
</div>
<div class="flex-1 space-y-3">
<label class="block text-sm font-bold text-zinc-600 px-2">次数 (reps)</label>
<div class="relative">
<input class="w-full bg-surface-container-highest border-none rounded-lg p-6 text-3xl font-headline font-black focus:ring-2 focus:ring-primary/20 transition-all text-zinc-900" type="number" value="12"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2 flex flex-col gap-1">
<button class="text-zinc-400 hover:text-primary active:scale-90 transition-all">
<span class="material-symbols-outlined">expand_less</span>
</button>
<button class="text-zinc-400 hover:text-primary active:scale-90 transition-all">
<span class="material-symbols-outlined">expand_more</span>
</button>
</div>
</div>
</div>
</div>
<!-- History Visualization (Asymmetric Card) -->
<div class="bg-surface-container-low p-6 rounded-lg overflow-hidden relative">
<h3 class="text-sm font-bold text-zinc-400 mb-6 uppercase tracking-wider">近期趋势</h3>
<div class="flex items-end gap-2 h-32">
<div class="flex-1 bg-zinc-200 h-[40%] rounded-t-md"></div>
<div class="flex-1 bg-zinc-200 h-[55%] rounded-t-md"></div>
<div class="flex-1 bg-zinc-300 h-[45%] rounded-t-md"></div>
<div class="flex-1 bg-zinc-200 h-[70%] rounded-t-md"></div>
<div class="flex-1 bg-primary h-[85%] rounded-t-md relative">
<div class="absolute -top-8 left-1/2 -translate-x-1/2 bg-primary text-white text-[10px] font-bold px-2 py-1 rounded">Today</div>
</div>
</div>
</div>
</section>
</main>
<!-- Bottom Action Bar (Fixed Floating) -->
<div class="fixed bottom-0 left-0 w-full p-6 z-50">
<div class="max-w-2xl mx-auto flex gap-4">
<button class="flex-1 h-16 rounded-full bg-gradient-to-br from-primary to-primary-container text-white font-headline font-extrabold text-lg flex items-center justify-center gap-3 shadow-lg shadow-red-500/30 active:scale-95 transition-transform">
<span>完成一组</span>
<span class="material-symbols-outlined" data-weight="fill">check_circle</span>
</button>
</div>
</div>
<!-- Hidden Sidebar for NavigationDrawer context -->
<div class="hidden lg:block fixed right-10 top-32 w-48 space-y-6">
<div class="bg-surface-container-low p-4 rounded-lg">
<h4 class="text-xs font-black text-red-700 uppercase mb-4 tracking-tighter">动作详情</h4>
<div class="w-full aspect-square rounded-lg bg-zinc-200 mb-4 overflow-hidden">
<img class="w-full h-full object-cover grayscale brightness-75" data-alt="cinematic close-up of a weightlifter's back muscles and barbell during a heavy squat in a dark industrial gym with dramatic backlighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA8sSglGpnMTvalvaCymcaAuKsu8Vyne_aHKsnyVnyWb8Vib0LE7plExvRmQqivinTFAIqU8fP_11VRm5YiJGGRm0Esw8g6Y3KuJu85UjKAi4LwBOJPDnX-ilPbsXUQ3lBZ_UTMDYoAxNQEn4JsRzM5z19fPouMpf4JGJ-TMCCsf8DOnc7azQTEUKHZ0kL8bM2dEw_9b93hOnYOReF4clm7441UHnzQtZK2-PpbhSNQGtc0SmHtsoZ_7pOM_79HiQmb6IRxs4agnequ"/>
</div>
<p class="text-xs text-zinc-500 leading-relaxed">
                背部挺直，下降时臀部向后，膝盖不超过脚尖，呼气发力。
            </p>
</div>
</div>
</body></html>
